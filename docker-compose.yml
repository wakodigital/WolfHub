services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wolfhub-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-wolfhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wolfhub_dev}
      POSTGRES_DB: ${DB_NAME:-wolfhub_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wolfhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wolfhub-network
    restart: unless-stopped

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: wolfhub-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wolfhub-network
    restart: unless-stopped

  # Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wolfhub-api
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-wolfhub}:${DB_PASSWORD:-wolfhub_dev}@postgres:5432/${DB_NAME:-wolfhub_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      API_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    networks:
      - wolfhub-network
    restart: unless-stopped

  # Frontend Dev Server
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wolfhub-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages
    networks:
      - wolfhub-network
    restart: unless-stopped

  # Adminer for Database Visualization (Optional)
  adminer:
    image: adminer:latest
    container_name: wolfhub-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - wolfhub-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  wolfhub-network:
    driver: bridge